[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-factory"
version = "0.1.1"
description = "AI factories that prove their work. Built on Pydantic AI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["pydantic-ai", "agents", "factory", "methodology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "pydantic-ai-slim>=2.68,<3",
  "pydantic>=2.14,<3",
  "opentelemetry-api>=1.30,<2",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
# Elephant Goldfish, in `pydantic_ai_factory.methodologies`, loads its skills through
# Pydantic AI Harness. The rest of the core does not need it.
methodologies = ["pydantic-ai-harness[skills]>=0.68,<0.69"]

[project.urls]
Homepage = "https://github.com/hnrly/pydantic-ai-factory"
Repository = "https://github.com/hnrly/pydantic-ai-factory"
Changelog = "https://github.com/hnrly/pydantic-ai-factory/blob/main/CHANGELOG.md"

[tool.uv.workspace]
members = ["packages/software"]

[tool.uv.sources]
pydantic-ai-factory-software = { workspace = true }

[dependency-groups]
dev = [
  "pydantic-ai-factory-software",
  "anyio>=4,<5",
  "import-linter>=2.16,<3",
  # Serves the benchmark's two port tools to Claude Code. `evals/port_tools.py` imports
  # `uvicorn` directly, though `mcp` already depends on it.
  "mcp>=2.3,<3",
  "opentelemetry-sdk>=1.30,<2",
  # The getting-started sample builds with Pydantic AI Harness. Its docs test needs
  # `coder`; the `live` tests need `anthropic`, the provider the samples name.
  "pydantic-ai-harness[coder,anthropic]>=0.68,<0.69",
  # The evaluation set in evals/ is built on it.
  "pydantic-evals>=2.68,<3",
  "pyright>=1.1.410,<2",
  "pytest>=9,<10",
  "pytest-examples>=0.0.18,<0.1",
  "ruff>=0.17,<0.18",
  "uvicorn>=0.54,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_factory"]

[tool.hatch.build.targets.sdist]
include = ["/src/pydantic_ai_factory/", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Markdown is left alone: the formatter would rewrite the `#>` output comments in doc samples.
extend-exclude = ["*.md", "*.mdx"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["pydantic_ai_factory", "pydantic_ai_factory_software"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"packages/*/tests/**" = ["S101"]

[tool.pyright]
include = ["src", "packages/software/src", "tests", "scripts", "evals"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The evaluation set is imported by its tests as `evals`, from the repository root.
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "live: makes real, paid model requests; skipped unless selected with -m live",
]
filterwarnings = ["error"]

# The package boundaries are part of the design, so they are checked on every change.
[tool.importlinter]
root_packages = ["pydantic_ai_factory", "pydantic_ai_factory_software"]
# Lets a contract name an installed package, such as Pydantic AI Harness, outside the two.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The generic core never imports a domain package"
type = "forbidden"
source_modules = ["pydantic_ai_factory"]
forbidden_modules = ["pydantic_ai_factory_software"]

[[tool.importlinter.contracts]]
name = "Core layers import downwards only"
type = "layers"
containers = ["pydantic_ai_factory"]
# Highest layer first. A layer in brackets may not exist yet; it is added by a later change.
layers = [
  "(cli)",
  "(methodologies)",
  "(stores)",
  "(factory)",
  "(stations)",
  "(_methodology)",
  "(gates)",
  "(artifacts)",
  "(contracts)",
]

[[tool.importlinter.contracts]]
name = "Only methodologies import Pydantic AI Harness"
type = "forbidden"
# Every core layer below `methodologies`, and the side module `_tracing`, so the core
# imports without the `methodologies` extra.
source_modules = [
  "pydantic_ai_factory.stores",
  "pydantic_ai_factory.factory",
  "pydantic_ai_factory.stations",
  "pydantic_ai_factory._methodology",
  "pydantic_ai_factory.gates",
  "pydantic_ai_factory.artifacts",
  "pydantic_ai_factory.contracts",
  "pydantic_ai_factory._tracing",
]
forbidden_modules = ["pydantic_ai_harness"]
