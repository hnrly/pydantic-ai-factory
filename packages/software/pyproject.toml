[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-factory-software"
version = "0.1.1"
description = "The software factory for Pydantic AI Factory, starting with the Design station."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
# Its designer uses Elephant Goldfish, which needs the core's `methodologies` extra.
dependencies = ["pydantic-ai-factory[methodologies]==0.1.1"]

[project.scripts]
factory = "pydantic_ai_factory_software.cli:entry"

[project.optional-dependencies]
# The model provider the samples name. Install another provider's extra to use its models.
anthropic = ["pydantic-ai-slim[anthropic]>=2.68,<3"]

[project.urls]
Homepage = "https://github.com/hnrly/pydantic-ai-factory"
Repository = "https://github.com/hnrly/pydantic-ai-factory"
Changelog = "https://github.com/hnrly/pydantic-ai-factory/blob/main/CHANGELOG.md"

[tool.uv.sources]
pydantic-ai-factory = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_factory_software"]

[tool.hatch.build.targets.sdist]
include = ["/src/pydantic_ai_factory_software/", "/pyproject.toml", "/README.md", "/LICENSE"]
